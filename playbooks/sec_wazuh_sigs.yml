---
# Distribute rootcheck signature files from the 'default' group to all
# custom Wazuh agent groups on the manager.
#
# Context: agents were moved to custom groups during group reconciliation.
# Wazuh does not merge 'default' into custom groups - an agent receives only
# the shared files of the groups it belongs to. The signature files were
# therefore orphaned in 'default' and reached no agent, leaving
# <check_files> and <check_trojans> declared but not running fleet-wide.
#
# Manager-side only. No agent configuration is touched and no agent restart
# is required; agents pick up the regenerated merged.mg on next sync.
#
# 'windows' is deliberately excluded: rootkit_files.txt and
# rootkit_trojans.txt are Linux path signatures. Windows agents use
# win_malware_rcl.txt and the other win_* policy files instead.

- name: Distribute Wazuh rootcheck signature files to agent groups
  hosts: sec.spacescience.ro
  gather_facts: false

  vars:
    wazuh_shared_dir: /var/ossec/etc/shared
    wazuh_groups:
      - alien
      - auger
      - eos
      - issaf
      - lisa
      - misc
      - r3b
      - vmhosts
      - vms
    wazuh_rootcheck_files:
      - rootkit_files.txt
      - rootkit_trojans.txt

  tasks:
    - name: Verify source signature files exist in default group
      ansible.builtin.stat:
        path: "{{ wazuh_shared_dir }}/default/{{ item }}"
      loop: "{{ wazuh_rootcheck_files }}"
      register: rootcheck_src

    - name: Fail if any source signature file is missing
      ansible.builtin.fail:
        msg: "Missing source file: {{ wazuh_shared_dir }}/default/{{ item.item }}"
      loop: "{{ rootcheck_src.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Verify target group directories exist
      ansible.builtin.stat:
        path: "{{ wazuh_shared_dir }}/{{ item }}"
      loop: "{{ wazuh_groups }}"
      register: rootcheck_groups

    - name: Fail if any target group directory is missing
      ansible.builtin.fail:
        msg: "Group directory absent: {{ wazuh_shared_dir }}/{{ item.item }}"
      loop: "{{ rootcheck_groups.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.isdir | default(false)

    # Ownership and mode match the existing files in the default group.
    # wazuh-remoted runs as the wazuh user and must be able to read these
    # to rebuild merged.mg.
    - name: Distribute rootcheck signature files to agent groups
      ansible.builtin.copy:
        src: "{{ wazuh_shared_dir }}/default/{{ item[1] }}"
        dest: "{{ wazuh_shared_dir }}/{{ item[0] }}/{{ item[1] }}"
        remote_src: true
        owner: wazuh
        group: wazuh
        mode: '0660'
      loop: "{{ wazuh_groups | product(wazuh_rootcheck_files) | list }}"
      loop_control:
        label: "{{ item[0] }}/{{ item[1] }}"
      register: rootcheck_dist

    # merged.mg is regenerated by wazuh-remoted on its own schedule.
    # No restart is issued here: restarting wazuh-manager disconnects the
    # whole agent fleet, which is not justified for a file distribution.
    - name: Report distribution result
      ansible.builtin.debug:
        msg: >-
          {{ rootcheck_dist.results | selectattr('changed') | list | length }}
          file(s) copied. Check merged.mg growth on the manager before
          verifying agents.

