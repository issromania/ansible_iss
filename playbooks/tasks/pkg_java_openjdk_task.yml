---
- name: Install Java openjdk (11 on EL9, 21 on EL10)
  vars:
    java_openjdk_version: "{{ '21' if ansible_facts['distribution_major_version'] == '10' else '11' }}"
  ansible.builtin.dnf:
    name:
      - "java-{{ java_openjdk_version }}-openjdk.x86_64"
      - "java-{{ java_openjdk_version }}-openjdk-headless.x86_64"
      - icedtea-web.x86_64
    state: present
    update_cache: false
  when: ansible_facts[ 'os_family' ] == 'RedHat'
