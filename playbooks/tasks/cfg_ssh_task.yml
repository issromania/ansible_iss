---
- name: Configure sshd ISS
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../additions/ssh/00-issgeneric.conf"
    dest: /etc/ssh/sshd_config.d/
    mode: "0600"
    owner: root
    group: root
    force: true
  when: >-
    ( ansible_facts['distribution'] == 'AlmaLinux' and ansible_facts['distribution_major_version'] in ['9', '10'] )
    or ansible_facts['distribution'] == 'Fedora'

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    enabled: true
