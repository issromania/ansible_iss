---
# Configure Telegraf node agent and push to VictoriaMetrics.
# Include from a play that sets become: true and gather_facts: true
# (facts virtualization_role + ipmi are required by the template).

- name: Import pkg_telegraf_task.yml
  ansible.builtin.include_tasks: pkg_telegraf_task.yml

- name: Find stray telegraf.d drop-in configs (single-file design => dir must be empty)
  ansible.builtin.find:
    paths: /etc/telegraf/telegraf.d
    patterns: "*.conf"
  register: tg_dropins
  tags: telegraf_cfg

- name: Purge stray telegraf.d drop-in configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ tg_dropins.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: tg_purge
  tags: telegraf_cfg

- name: Create systemd drop-in dir for telegraf
  ansible.builtin.file:
    path: /etc/systemd/system/telegraf.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: telegraf_cfg

- name: Run telegraf as root (override packaged User=telegraf)
  ansible.builtin.copy:
    dest: /etc/systemd/system/telegraf.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      User=root
      Group=root
  register: tg_override
  tags: telegraf_cfg

- name: Load ipmi_devintf so /dev/ipmi0 exists (physical + BMC hosts)
  community.general.modprobe:
    name: ipmi_devintf
    state: present
    persistent: present
  when:
    - ansible_facts['virtualization_role'] != 'guest'
    - ansible_facts['ipmi'] | default(false) | bool
  tags: telegraf_cfg

- name: Deploy NFS server parser (nfs hosts only)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../additions/nfs/nfsd_stats.awk"
    dest: /usr/local/bin/nfsd_stats.awk
    owner: root
    group: root
    mode: "0755"
  when: telegraf_nfs | default(false) | bool
  tags: telegraf_cfg

- name: Template telegraf.conf
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../additions/telegraf/telegraf.conf.j2"
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: root
    mode: "0640"
    validate: "telegraf --test --config %s"
  register: tg_conf
  tags: telegraf_cfg

- name: Enable and (re)start telegraf
  ansible.builtin.systemd:
    name: telegraf
    enabled: true
    state: "{{ 'restarted' if (tg_conf is changed or tg_override is changed or tg_purge is changed or (tg_pkg is defined and tg_pkg is changed)) else 'started' }}"
    daemon_reload: true
  tags: telegraf_cfg

- name: Verify telegraf is actually running
  ansible.builtin.command: systemctl is-active telegraf
  register: tg_active
  changed_when: false
  failed_when: tg_active.stdout != "active"
  tags: telegraf_cfg
