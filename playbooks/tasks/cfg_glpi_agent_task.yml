---
# tasks/glpi_agent.yml
# GLPI Agent 1.17 . institutional inventory. AlmaLinux 9/10, Ubuntu, Windows.
# Scanner role pinned to monitor.spacescience.ro (co-located with the GLPI server).
# House style: FQCN, no handlers, no become (runs as root), inline register/when.
# TARGETING: the calling play must target institutional hosts only.
#            hal (personal home desktop) must NEVER be in scope . guarded below.

- name: GLPI agent | enable CRB repo (EL)
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  register: crb_enable
  changed_when: true
  when:
    - ansible_facts['os_family'] == 'RedHat'

- name: GLPI agent | common facts
  ansible.builtin.set_fact:
    glpi_agent_version: "1.19"
    glpi_server_url: "https://inventory.spacescience.ro/front/inventory.php"
    glpi_agent_tag: "{{ inventory_cluster | default('misc', true) }}"
    glpi_scanner_host: "monitor.spacescience.ro"
    glpi_is_scanner: "{{ inventory_hostname == 'monitor.spacescience.ro' }}"

# ---- AlmaLinux 9 / 10 ----
- name: GLPI agent | install (EL)
  ansible.builtin.dnf:
    name: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent-{{ glpi_agent_version }}-1.noarch.rpm"
    state: present
    disable_gpg_check: true          # GitHub RPM unsigned for your keyring; verify published sha256 as compensating control
  register: glpi_el
  when: ansible_facts['os_family'] == 'RedHat'
  # EL10/DNF5: if python-dnf bindings error, switch to ansible.builtin.dnf5. Needs EPEL (you mirror it) for perl deps.

- name: GLPI agent | network task (scanner only, EL)
  ansible.builtin.dnf:
    name: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent-task-network-{{ glpi_agent_version }}-1.noarch.rpm"
    state: present
    disable_gpg_check: true
  when:
    - glpi_is_scanner | bool
    - ansible_facts['os_family'] == 'RedHat'

# ---- Ubuntu ----
- name: GLPI agent | install (Ubuntu)
  ansible.builtin.apt:
    deb: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent_{{ glpi_agent_version }}-1_all.deb"
    state: present
  register: glpi_deb
  when: ansible_facts['distribution'] == 'Ubuntu'

# ---- Linux config (EL + Ubuntu) ----
- name: GLPI agent | config (Linux)
  ansible.builtin.copy:
    dest: /etc/glpi-agent/conf.d/00-iss.cfg
    owner: root
    group: root
    mode: '0640'
    content: |
      server = {{ glpi_server_url }}
      tag = {{ glpi_agent_tag }}
      {% if glpi_is_scanner %}
      # scanner (co-located with GLPI server): accept loopback-triggered network tasks
      httpd-trust = 127.0.0.1
      {% else %}
      no-httpd = 1
      {% endif %}
  register: glpi_cfg
  when: ansible_facts['system'] == 'Linux'

# ---- ssh-keyscan shim (Linux) ----
# glpi-agent's Generic::SSH inventory module runs `ssh-keyscan -T 1 <ip>` with no -t,
# probing 5 host key types in parallel. That exceeds sshd's MaxStartups begin value
# (4 on fst*), triggering daemon-wide throttling and dropped connections once per
# inventory cycle. Restricting to the 3 types that exist keeps it under the threshold
# and removes the two sk-* negotiation failures that can never succeed.

- name: GLPI agent | shim directories (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/glpi-wrap
    - /etc/systemd/system/glpi-agent.service.d
  when: ansible_facts['system'] == 'Linux'

- name: GLPI agent | ssh-keyscan shim (Linux)
  ansible.builtin.copy:
    dest: /opt/glpi-wrap/ssh-keyscan
    owner: root
    group: root
    mode: '0755'
    setype: bin_t                    # no-op where SELinux is disabled; see note 3
    content: |
      #!/bin/sh
      # Managed by Ansible - glpi_agent task. Do not edit.
      exec /usr/bin/ssh-keyscan -t rsa,ecdsa,ed25519 "$@"
  register: glpi_shim
  when: ansible_facts['system'] == 'Linux'

- name: GLPI agent | PATH drop-in pointing at shim (Linux)
  ansible.builtin.copy:
    dest: /etc/systemd/system/glpi-agent.service.d/10-path.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible - glpi_agent task. Do not edit.
      [Service]
      Environment=PATH=/opt/glpi-wrap:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
  register: glpi_pathdrop
  when: ansible_facts['system'] == 'Linux'

- name: GLPI agent | enable/(re)start service (Linux)
  ansible.builtin.systemd:
    name: glpi-agent
    enabled: true
    daemon_reload: "{{ glpi_pathdrop is changed }}"
    state: "{{ 'restarted' if (glpi_cfg is changed or glpi_shim is changed or glpi_pathdrop is changed) else 'started' }}"
  when: ansible_facts['system'] == 'Linux'

# ---- Windows (over OpenSSH; ansible.windows) ----
- name: GLPI agent | install MSI (Windows)
  ansible.windows.win_package:
    path: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/GLPI-Agent-{{ glpi_agent_version }}-x64.msi"
    state: present
    arguments:
      - SERVER={{ glpi_server_url }}
      - RUNNOW=1
      - TAG={{ glpi_agent_tag }}
  when: ansible_facts['os_family'] == 'Windows'
