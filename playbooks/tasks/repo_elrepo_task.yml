---
- name: Enable ElRepo Repository on EL 9
  ansible.builtin.dnf:
    name: elrepo-release.noarch
    state: present
    update_cache: false
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux' and ansible_facts[ 'distribution_major_version' ] == '9'
  tags: repo

- name: ElRepo key import - EL10
  ansible.builtin.rpm_key:
    key: https://www.elrepo.org/RPM-GPG-KEY-v2-elrepo.org
    state: present
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux' and ansible_facts[ 'distribution_major_version' ] == '10'
  tags: repo

- name: Enable ElRepo Repository on EL 10
  ansible.builtin.dnf:
    name: https://www.elrepo.org/elrepo-release-10.el10.elrepo.noarch.rpm
    state: present
    update_cache: false
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux' and ansible_facts[ 'distribution_major_version' ] == '10'
  tags: repo

- name: Enable permanently elrepo
  community.general.ini_file:
    path: /etc/yum.repos.d/elrepo.repo
    section: elrepo
    option: enabled
    value: '1'
    mode: '0644'
    create: false
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux'

- name: Enable permanently elrepo-kernel
  community.general.ini_file:
    path: /etc/yum.repos.d/elrepo.repo
    section: elrepo-kernel
    option: enabled
    value: '1'
    mode: '0644'
    create: false
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux'

- name: Enable permanently elrepo-extras
  community.general.ini_file:
    path: /etc/yum.repos.d/elrepo.repo
    section: elrepo-extras
    option: enabled
    value: '1'
    mode: '0644'
    create: false
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux'
