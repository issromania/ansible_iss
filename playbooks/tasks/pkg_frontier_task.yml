---
- name: Include repo_frontier_task.yml
  ansible.builtin.include_tasks: repo_frontier_task.yml

- name: Create squid dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /etc/squid
    - "{{ frontier_logs }}"
    - "{{ frontier_cache }}"

- name: Create squidconf
  ansible.builtin.copy:
    dest: "/etc/squid/squidconf"
    force: true
    mode: "0644"
    content: |
      export FRONTIER_USER=frontier
      export FRONTIER_GROUP=frontier
      export SETSQUIDAFFINITY=true
      export SQUID_CLEAN_CACHE_ON_START=false

- name: Install Frontier packages
  ansible.builtin.dnf:
    name: frontier-squid
    state: present
    enablerepo: "cern-frontier"
  tags: packages

- name: Frontier squid customizations
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../additions/frontier/customize.sh.j2"
    dest: /etc/squid/customize.sh
    owner: frontier
    group: frontier
    mode: '0755'
    backup: true
    force: true

- name: Proper ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: frontier
    group: frontier
    state: directory
    recurse: true
  with_items:
    - /etc/squid
    - "{{ frontier_logs }}"
    - "{{ frontier_cache }}"
