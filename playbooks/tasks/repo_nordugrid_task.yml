---
- name: Import Nordugrid key
  ansible.builtin.rpm_key:
    state: present
    key: http://download.nordugrid.org/RPM-GPG-KEY-nordugrid-7

- name: Install Nordugrid repository EL9/EL10
  ansible.builtin.dnf:
    name: >-
      https://download.nordugrid.org/packages/nordugrid-release/releases/7/rocky/{{
      ansible_facts['distribution_major_version'] }}/x86_64/nordugrid-release-7-1.el{{
      ansible_facts['distribution_major_version'] }}.noarch.rpm
    state: present
  when: ansible_facts[ 'distribution' ] == 'AlmaLinux' and ansible_facts[ 'distribution_major_version' ] in ['9', '10']
  tags: repo

- name: Check existence of epel.repo
  ansible.builtin.stat:
    path: /etc/yum.repos.d/epel.repo
  register: epel_present

- name: Check existence of epel-testing.repo
  ansible.builtin.stat:
    path: /etc/yum.repos.d/epel-testing.repo
  register: epel_testing_present

- name: Epel - exclude nordugrid
  community.general.ini_file:
    path: /etc/yum.repos.d/epel.repo
    section: epel
    option: exclude
    value: "*nordugrid-*"
    create: false
    no_extra_spaces: true
  when: epel_present.stat.exists

- name: Epel-testing - exclude nordugrid
  community.general.ini_file:
    path: /etc/yum.repos.d/epel-testing.repo
    section: epel-testing
    option: exclude
    value: "*nordugrid-*"
    create: false
    no_extra_spaces: true
  when: epel_testing_present.stat.exists
