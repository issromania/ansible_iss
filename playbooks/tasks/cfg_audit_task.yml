---
# tasks/cfg_audit_task.yml
#
# Goal: detect attacker actions on an already-breached host, at low volume.
#
# Design: file watches on things that never legitimately change, plus four
# narrow syscall rules. NO blanket execve auditing -- that is high volume and
# near-zero signal, because root legitimately runs commands constantly.
#
# Keys are semantic (iss-*), NOT the stock audit-wazuh-* keys. Severity is
# assigned by local_rules.xml descending from rule 80700, which gives full
# control over alert level. See the companion iss_audit_rules.xml.
#
# FILENAME: zz-iss-detect.rules, not the conventional 99-.
#   [Assumption] Several distributions ship /etc/audit/rules.d/audit.rules
#   containing "-D" (delete all rules). augenrules concatenates rules.d in
#   natural sort order, and in the C locale "audit.rules" sorts AFTER any
#   digit-prefixed filename -- so a 99- file can be silently wiped by that
#   -D. A zz- prefix removes the question entirely. The assert task below
#   is the empirical check.
#
# Standalone. No handlers, no become -- runs as root.
# Compatible: AlmaLinux 9/10, Fedora, Ubuntu 20.04/22.04/24.04.
#
# Ubuntu 20.04 requires ansible_python_interpreter=/usr/bin/python3.9 set
# inline on the inventory host line (system python3 is 3.8, below the
# ansible-core minimum of 3.9).

- name: audit | Install the audit package (RedHat family)
  ansible.builtin.package:
    name: audit
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: audit | Check whether auditd is installed (Debian family)
  ansible.builtin.command:
    cmd: dpkg-query -W -f=${Status} auditd
  register: _deb_auditd
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: audit | Refresh apt cache before install (Debian family)
  ansible.builtin.command:
    cmd: apt-get update -qq
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - ansible_facts['os_family'] == 'Debian'
    - "'install ok installed' not in _deb_auditd.stdout | default('')"
  changed_when: false

- name: audit | Install the audit package (Debian family)
  # apt-get via command, NOT ansible.builtin.package. The package module
  # delegates to the apt module, which requires python3-apt on the target.
  # python3-apt ships a compiled extension bound to the distribution's DEFAULT
  # interpreter -- python3.8 on Ubuntu 20.04 -- and is therefore not importable
  # under the python3.9 that ansible-core requires. Verified on eumetsat
  # 2026-08-27. There is no python3.9-apt package. Driving apt-get directly
  # removes the dependency entirely.
  ansible.builtin.command:
    cmd: apt-get install -y -q auditd
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - ansible_facts['os_family'] == 'Debian'
    - "'install ok installed' not in _deb_auditd.stdout | default('')"

- name: audit | Ensure auditd is enabled and running
  # auditd.service carries RefuseManualStop=yes on EL. Rules are loaded with
  # augenrules below; never use state: restarted here.
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: audit | Deploy breach-detection audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/zz-iss-detect.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      ## Managed by Ansible - do not edit manually.
      ##
      ## -w PATH -p wa   is shorthand for  -F path=PATH -F perm=wa
      ## -p w  write   -p a  attribute change   -p r  read   -p x  execute
      ##
      ## Watches do NOT support wildcards and do NOT follow the path if the
      ## file is renamed or replaced by a new inode. They fire on the path,
      ## which is what matters here -- an attacker editing /etc/sudoers hits
      ## the watch regardless of how the editor writes the file.

      ## =================================================================
      ## 1. DEFENSE EVASION -- tampering with the audit trail or the agent
      ##    Volume: zero, except when Ansible itself changes these.
      ##    Signal: maximum. Nothing else should ever touch these.
      ## =================================================================
      -w /etc/audit/                  -p wa -k iss-evasion
      -w /etc/audit/rules.d/          -p wa -k iss-evasion
      -w /etc/selinux/                -p wa -k iss-evasion
      -w /usr/sbin/setenforce         -p x  -k iss-evasion

      ## Wazuh agent config. Scoped to two files, NOT the whole directory:
      ## /var/ossec/etc/shared/merged.mg is rewritten on every group config
      ## sync, and a directory watch is recursive.
      ##
      ## client.keys is EXCLUDED on the manager: on sec it is rewritten on
      ## every agent enrollment, so the watch would fire once per enrolling
      ## agent. On an agent it changes once, at enrollment.
      -w /var/ossec/etc/ossec.conf    -p wa -k iss-evasion
      {{ '-w /var/ossec/etc/client.keys   -p wa -k iss-evasion' if inventory_hostname != 'sec.spacescience.ro' else '## client.keys watch omitted: this host is the Wazuh manager.' }}

      ## NOT WATCHED, and this is deliberate:
      ##   -w /usr/sbin/auditctl   -p x
      ##   -w /usr/sbin/augenrules -p x
      ## Measured on sev: these fire on read-only invocations too. The
      ## verification tasks in this very playbook run "auditctl -l" and
      ## "auditctl -s", each producing a level-12 alert per host per run.
      ## The execute watch adds no signal, because every actual rule change
      ## already emits a CONFIG_CHANGE record regardless of which binary
      ## made it.

      ## LD_PRELOAD userland rootkits. Should never exist or change.
      -w /etc/ld.so.preload           -p wa -k iss-evasion
      -w /etc/ld.so.conf.d/           -p wa -k iss-evasion

      ## =================================================================
      ## 2. PERSISTENCE
      ##    Volume: near zero outside of legitimate config management.
      ## =================================================================
      -w /etc/crontab                 -p wa -k iss-persist
      -w /etc/cron.d/                 -p wa -k iss-persist
      -w /etc/cron.hourly/            -p wa -k iss-persist
      -w /etc/cron.daily/             -p wa -k iss-persist
      -w /etc/cron.weekly/            -p wa -k iss-persist
      -w /etc/cron.monthly/           -p wa -k iss-persist
      -w /var/spool/cron/             -p wa -k iss-persist
      -w /etc/systemd/system/         -p wa -k iss-persist
      -w /etc/ssh/sshd_config         -p wa -k iss-persist
      -w /etc/ssh/sshd_config.d/      -p wa -k iss-persist
      -w /root/.ssh/                  -p wa -k iss-persist

      ## NOT WATCHED, deliberately:
      ##   /usr/lib/systemd/system/  -- every package install writes here.
      ##       Package changes are already tracked via SOFTWARE_UPDATE.
      ##   /home/*/.ssh/authorized_keys -- audit has no wildcard support.
      ##       Cover this with Wazuh FIM (syscheck), which does glob.

      ## =================================================================
      ## 3. ACCOUNT AND PRIVILEGE MANIPULATION
      ##    Volume: near zero. Password changes are the only routine hit.
      ## =================================================================
      -w /etc/passwd                  -p wa -k iss-account
      -w /etc/shadow                  -p wa -k iss-account
      -w /etc/group                   -p wa -k iss-account
      -w /etc/gshadow                 -p wa -k iss-account
      -w /etc/sudoers                 -p wa -k iss-account
      -w /etc/sudoers.d/              -p wa -k iss-account
      -w /etc/pam.d/                  -p wa -k iss-account
      -w /etc/security/               -p wa -k iss-account

      ## NOT WATCHED: -w /etc/shadow -p r
      ##   Every PAM authentication reads it (sshd, sudo, su, unix_chkpwd).
      ##   High volume, no signal.

      ## =================================================================
      ## 4. KERNEL MODULE LOADING -- rootkits
      ##    Volume: a small burst at boot, then effectively zero.
      ## =================================================================
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k iss-kernel
      -w /etc/modprobe.d/             -p wa -k iss-kernel
      -w /usr/sbin/insmod             -p x  -k iss-kernel
      -w /usr/sbin/modprobe           -p x  -k iss-kernel

      ## =================================================================
      ## 5. EXECUTION FROM WRITABLE DIRECTORIES
      ##    The single highest-value rule in this file. A dropped payload
      ##    almost always runs from one of these.
      ##    Volume: usually zero on a server. MEASURE FIRST on HPC nodes --
      ##    job scratch and build systems may execute from /tmp routinely.
      ## =================================================================
      -a always,exit -F arch=b64 -F dir=/tmp     -F perm=x -k iss-tmpexec
      -a always,exit -F arch=b64 -F dir=/var/tmp -F perm=x -k iss-tmpexec
      -a always,exit -F arch=b64 -F dir=/dev/shm -F perm=x -k iss-tmpexec

      ## =================================================================
      ## 6. PRIVILEGE ESCALATION VIA SETUID BINARY
      ##    -C uid!=euid -F euid=0 matches execve where the real UID differs
      ##    from an effective UID of 0 -- i.e. a setuid-root binary. The exit
      ##    filter evaluates credentials post-exec, which is why this works.
      ##    Catches sudo, su, pkexec, passwd, mount, and any planted
      ##    setuid-root payload.
      ##    Volume: proportional to admin sudo usage. Moderate, not high.
      ## =================================================================
      -a always,exit -F arch=b64 -C uid!=euid -F euid=0 -S execve -k iss-privesc
      -a always,exit -F arch=b32 -C uid!=euid -F euid=0 -S execve -k iss-privesc

      ## =================================================================
      ## DELIBERATELY EXCLUDED
      ##   -S execve -F euid=0        thousands/day, no signal
      ##   -S socket,connect,bind     tens of thousands/day, no signal;
      ##                              use firewall logs instead
      ##   -S open,openat write mask  enormous volume
      ##   -w /var/log/ -p wa         every daemon writes there constantly
      ##
      ## TUNING: auditd stops at the first matching rule. To silence a known
      ## noisy path, add a never,exit rule ABOVE the relevant always rule:
      ##   -a never,exit -F arch=b64 -F dir=/tmp -F perm=x -F auid=989
  register: _audit_rules

- name: audit | Detect ARC-CE BDII provider directory
  # auditctl REJECTS a -F dir= rule when the directory does not exist, so the
  # exclusion below must not be deployed fleet-wide. Gating on the path makes
  # the rule self-scoping: no inventory variable, no group membership needed.
  ansible.builtin.stat:
    path: /var/tmp/arc
  register: _arc_dir

- name: audit | Deploy iss-tmpexec exclusions where ARC-CE is present
  # Measured 2026-08-27 on grid05 and alien: ARC-CE (nordugrid) runs its BDII
  # information providers as perl scripts out of /var/tmp/arc/bdii/provider/,
  # under uid 55 (ldap, the OpenLDAP server account -- BDII is LDAP-based)
  # with auid unset (daemon context). 28 iss-tmpexec alerts per host on each.
  # Legitimate.
  #
  # FILENAME: zy- sorts BEFORE zz-iss-detect.rules. Required -- auditd stops
  # at the first matching rule, so a never,exit rule is only effective if it
  # loads ahead of the always,exit rule it is meant to suppress.
  #
  # SCOPE: uid + directory only. Deliberately NOT excluding all of /var/tmp,
  # and deliberately NOT excluding uid 55 everywhere. A payload dropped in
  # /tmp or /dev/shm by this same account still alerts.
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/zy-iss-exclusions.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      ## Managed by Ansible - do not edit manually.
      ## ARC-CE BDII information providers, running as uid 55 (ldap).
      ## See tasks/cfg_audit_task.yml for the rationale and scope limits.
      -a never,exit -F arch=b64 -F dir=/var/tmp/arc -F perm=x -F uid=55
  when: _arc_dir.stat.exists
  register: _audit_exclusions

- name: audit | Remove stale exclusions where ARC-CE is absent
  # If ARC-CE is uninstalled, a leftover -F dir= rule for a nonexistent path
  # makes augenrules --load fail for the whole ruleset.
  ansible.builtin.file:
    path: /etc/audit/rules.d/zy-iss-exclusions.rules
    state: absent
  when: not _arc_dir.stat.exists
  register: _audit_exclusions_removed

- name: audit | Load the rules into the kernel
  ansible.builtin.command:
    cmd: augenrules --load
  when: _audit_rules is changed
        or _audit_exclusions is changed
        or _audit_exclusions_removed is changed
  changed_when: true

- name: audit | Read the kernel ruleset before verification
  ansible.builtin.command:
    cmd: auditctl -l
  register: _audit_pre
  changed_when: false

- name: audit | Force-load the merged ruleset if the kernel is short
  # augenrules --load compares its merged output against /etc/audit/audit.rules
  # and prints "No change" WITHOUT loading when they are identical. If the
  # kernel ruleset was flushed -- auditd restart, auditctl -D, a package
  # upgrade -- while the merged file is already correct, augenrules will NEVER
  # restore it and the host sits with an empty ruleset indefinitely.
  # Observed on eumetsat 2026-08-28: correct merged file, "No change",
  # zero rules in the kernel. auditctl -R loads the file directly and
  # bypasses that comparison.
  ansible.builtin.command:
    cmd: auditctl -R /etc/audit/audit.rules
  when: _audit_pre.stdout | regex_findall('iss-') | length < 35
  changed_when: true

- name: audit | Re-read the kernel ruleset
  ansible.builtin.command:
    cmd: auditctl -l
  register: _audit_loaded
  changed_when: false

- name: audit | Assert every rule category loaded into the kernel
  # Counts rules AND checks each category. The previous form -- a substring
  # test for 'iss-evasion' alone -- passed on a host with only 4 of 36 rules
  # loaded, because augenrules reports per-rule rejections on stderr and
  # continues. A partial load looked identical to success.
  #
  # Threshold 35, not 36: the Wazuh manager omits the client.keys watch
  # (see the Jinja conditional in the rules content above).
  ansible.builtin.assert:
    that:
      - "'iss-evasion' in _audit_loaded.stdout"
      - "'iss-persist' in _audit_loaded.stdout"
      - "'iss-account' in _audit_loaded.stdout"
      - "'iss-kernel' in _audit_loaded.stdout"
      - "'iss-tmpexec' in _audit_loaded.stdout"
      - "'iss-privesc' in _audit_loaded.stdout"
      - _audit_loaded.stdout | regex_findall('iss-') | length >= 35
    fail_msg: >-
      Only {{ _audit_loaded.stdout | regex_findall('iss-') | length }} iss-*
      rules in the kernel ruleset (expected 35+). Check (a) '-e 2' in
      /etc/audit/audit.rules -- immutable mode needs a reboot; (b) a
      later-sorted file in /etc/audit/rules.d containing '-D'; (c) run
      'auditctl -R /etc/audit/audit.rules' by hand to see per-rule
      rejections, which augenrules swallows.

- name: audit | Read kernel audit backlog and loss counters
  ansible.builtin.command:
    cmd: auditctl -s
  register: _audit_status
  changed_when: false

- name: audit | Report audit status
  # lost= must be 0. Non-zero means the kernel dropped records and the
  # trail has holes -- raise -b, do not remove rules.
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ _audit_status.stdout }}"

- name: audit | Check whether a Wazuh agent is installed at all
  # Measured on the fleet 2026-08-26: 30 of 97 hosts have no agent. Without
  # this gate the blockinfile below fails on every one of them, because
  # grep returns rc=2 (no such file) and "" | int evaluates to 0.
  ansible.builtin.stat:
    path: /var/ossec/etc/ossec.conf
  register: _ossec_conf

- name: audit | Report hosts with no Wazuh agent
  # An audit trail that never leaves the host is deletable by the same root
  # account the rules are meant to watch. Not evidentiary under NIS2.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: NO WAZUH AGENT. Audit rules are loaded but
      records stay local. Install the agent before relying on this host.
  when: not _ossec_conf.stat.exists

- name: audit | Check whether the Wazuh agent is collecting audit.log
  # audit.log does NOT pass through journald, so journald collection does
  # not cover it. Present by default only if the audit package was
  # installed BEFORE the Wazuh agent -- otherwise absent.
  ansible.builtin.command:
    cmd: grep -c '/var/log/audit/audit.log' /var/ossec/etc/ossec.conf
  register: _wazuh_audit_localfile
  changed_when: false
  failed_when: false
  when: _ossec_conf.stat.exists

- name: audit | Add the audit.log localfile block to ossec.conf
  # Gated on the grep: adding unconditionally would duplicate the stock
  # block on hosts that already have it, and Wazuh would read the file
  # twice. default('0') guards the skipped-task case.
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "  <!-- {mark} ANSIBLE MANAGED: auditd collection -->"
    insertbefore: '</ossec_config>'
    backup: true
    block: |
      <localfile>
        <log_format>audit</log_format>
        <location>/var/log/audit/audit.log</location>
      </localfile>
  when:
    - _ossec_conf.stat.exists
    - _wazuh_audit_localfile.stdout | default('0') | int == 0
  register: _wazuh_localfile_added

- name: audit | Restart the Wazuh agent if the collection config changed
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
  when: _wazuh_localfile_added is changed
  register: _wazuh_restart

- name: audit | Verify the Wazuh agent daemons came back up
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-control status
  register: _wazuh_status
  changed_when: false
  retries: 5
  delay: 3
  until: "'wazuh-agentd is running' in _wazuh_status.stdout"
  when: _wazuh_restart is changed
