---
# Pakiti client: /root/bin/pakiti_client_iss_send sends this host's package inventory
# (glpi-inventory | glpi-injector) to pakiti.spacescience.ro; cron runs it once a day.
# Host group in Pakiti = inventory_cluster (fallback "misc"). AlmaLinux hosts only for now.

- name: Pakiti client - check that glpi-injector is installed
  ansible.builtin.stat:
    path: /usr/bin/glpi-injector
  register: pakiti_injector

- name: Pakiti client - ensure /root/bin exists
  ansible.builtin.file:
    path: /root/bin
    state: directory
  when:
    - ansible_facts['distribution'] in ['AlmaLinux', 'Ubuntu']
    - pakiti_injector.stat.exists

- name: Pakiti client - install pakiti_client_iss_send
  ansible.builtin.copy:
    dest: /root/bin/pakiti_client_iss_send
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/bin/bash
      # Managed by Ansible (pakiti_client.yml) - local changes are overwritten.
      #
      # pakiti_client_iss_send - send this host's package inventory to the ISS Pakiti server.
      # The inventory is made by glpi-inventory and sent by glpi-injector; the tag becomes
      # the host group in Pakiti. Run by /etc/cron.d/pakiti-client-iss; can be run by hand.
      set -o pipefail

      PAKITI_URL="https://pakiti.spacescience.ro/feed/"
      PAKITI_GROUP="{{ inventory_cluster | default('misc') }}"

      glpi-inventory --json -t "${PAKITI_GROUP}" 2>/dev/null | glpi-injector --stdin -u "${PAKITI_URL}"
  when:
    - ansible_facts['distribution'] in ['AlmaLinux', 'Ubuntu']
    - pakiti_injector.stat.exists

- name: Pakiti client - schedule a daily report
  ansible.builtin.copy:
    dest: /etc/cron.d/pakiti-client-iss
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (pakiti_client.yml) - daily package report to pakiti.spacescience.ro
      SHELL=/bin/bash
      PATH=/root/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MAILTO=""
      {{ 59 | random(seed=inventory_hostname) }} {{ 23 | random(seed=inventory_hostname) }} * * * root /root/bin/pakiti_client_iss_send >/dev/null 2>&1
  when:
    - ansible_facts['distribution'] in ['AlmaLinux', 'Ubuntu']
    - pakiti_injector.stat.exists

